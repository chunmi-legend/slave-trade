<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>노예 무역의 명과 암 - 두 얼굴의 역사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Serif KR', serif;
            margin: 0;
            overflow: hidden; 
            background-color: #050505; 
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 1;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        #home-screen {
            background: radial-gradient(circle at center, #1a1a2e 0%, #050505 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 2rem;
        }
        
        .flag-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            filter: grayscale(100%) opacity(0.7);
        }
        .flag-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.4);
            filter: grayscale(0%) opacity(1);
        }

        #detail-screen { background-color: #000; }

        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        #panel-dark {
            background: linear-gradient(135deg, #380404 0%, #000000 100%);
            z-index: 1;
        }

        #panel-light {
            background: linear-gradient(135deg, #ffffff 0%, #fef08a 100%);
            z-index: 2;
            clip-path: inset(0 50% 0 0); 
        }

        #flag-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            z-index: 3;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        #flag-tint {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            mix-blend-mode: multiply; 
        }

        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            z-index: 4;
            pointer-events: none; 
        }

        .content-wrapper {
            width: 50vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 5rem;
            opacity: 0; 
        }

        .content-left { align-items: flex-start; text-align: left; }
        .content-right { align-items: flex-end; text-align: right; }

        .info-box {
            max-width: 500px;
            padding: 2.5rem;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            pointer-events: auto; 
        }

        .info-box.light {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #fbbf24;
            box-shadow: 0 20px 50px rgba(251, 191, 36, 0.3);
            color: #1e293b;
        }

        .info-box.dark {
            background: rgba(15, 0, 0, 0.85);
            border: 1px solid #dc2626;
            box-shadow: 0 20px 50px rgba(220, 38, 38, 0.5);
            color: #f8fafc;
        }

        /* Dynamic Media Image/Video classes */
        .media-element {
            width: 100%;
            border-radius: 8px;
            margin-top: 1.5rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            object-fit: cover;
            max-height: 250px;
        }
        
        .light .media-element { border: 2px solid rgba(251, 191, 36, 0.5); }
        .dark .media-element { border: 2px solid rgba(220, 38, 38, 0.5); }

        #slider-wrapper {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px; 
            cursor: ew-resize;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slider-line {
            width: 6px;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(0,0,0,1), 0 0 5px rgba(255,255,255,0.8);
            position: relative;
        }

        .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: #0f172a;
            border: 4px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 0 30px rgba(0,0,0,1);
            transition: transform 0.2s, background 0.2s;
        }
        
        #slider-wrapper:hover .slider-button,
        #slider-wrapper:active .slider-button {
            transform: translate(-50%, -50%) scale(1.1);
            background: #3b82f6;
        }

        .detail-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.5rem 2rem;
            z-index: 20;
            pointer-events: none;
        }
        .detail-header button { pointer-events: auto; }

        @media (max-width: 768px) {
            .content-wrapper { padding: 1.5rem; width: 100%; }
            .info-box { padding: 1.5rem; }
            #slider-wrapper { width: 100px; } 
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="max-w-4xl text-center mb-16">
            <h1 class="text-4xl md:text-6xl font-black mb-6 tracking-tight drop-shadow-lg">
                <span class="text-slate-200">대서양 노예 무역의</span><br class="md:hidden"> 
                <span class="text-yellow-500">명(明)</span>과 
                <span class="text-red-600">암(暗)</span>
            </h1>
            <p class="text-lg md:text-xl text-slate-400">
                눈부신 발전과 번영의 이면, 결코 잊어선 안 될 희생의 역사를 마주합니다.<br>
                국기를 선택하여 가려진 진실을 확인하세요.
            </p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 max-w-6xl w-full px-4" id="flags-container">
            <!-- JS injects flags here -->
        </div>
    </div>

    <div id="detail-screen" class="screen">
        
        <div class="detail-header flex items-center justify-between">
            <button onclick="goBack()" class="px-5 py-2.5 bg-slate-900/90 hover:bg-slate-700 text-white rounded-full transition-all flex items-center gap-2 text-sm border border-slate-600 shadow-xl backdrop-blur-md">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                다른 국가 선택
            </button>
        </div>

        <div id="panel-dark" class="panel"></div>
        <div id="panel-light" class="panel"></div>

        <div id="flag-overlay">
            <div id="flag-tint"></div>
        </div>

        <div class="content-layer">
            <!-- Light Content (Left) -->
            <div class="content-wrapper content-left" id="content-light">
                <div class="info-box light">
                    <div class="flex items-center gap-3 mb-2">
                        <h3 class="text-4xl font-black text-yellow-600">명(明)</h3>
                        <span class="text-yellow-600/60 font-bold uppercase tracking-widest">Prosperity</span>
                    </div>
                    <div class="h-1 w-20 bg-yellow-400 mb-4"></div>
                    <h4 id="light-title" class="text-2xl font-bold mb-3 text-slate-800"></h4>
                    <p id="light-desc" class="text-slate-700 text-sm md:text-base leading-relaxed font-medium"></p>
                    
                    <!-- Dynamic Media Container (Image or Video goes here) -->
                    <div id="light-media-container"></div>
                </div>
            </div>

            <!-- Dark Content (Right) -->
            <div class="content-wrapper content-right" id="content-dark">
                <div class="info-box dark">
                    <div class="flex items-center justify-end gap-3 mb-2">
                        <span class="text-red-600/60 font-bold uppercase tracking-widest">Atrocity</span>
                        <h3 class="text-4xl font-black text-red-600">암(暗)</h3>
                    </div>
                    <div class="h-1 w-20 bg-red-700 ml-auto mb-4"></div>
                    <h4 id="dark-title" class="text-2xl font-bold mb-3 text-white"></h4>
                    <p id="dark-desc" class="text-slate-300 text-sm md:text-base leading-relaxed font-light"></p>
                    
                    <!-- Dynamic Media Container (Image or Video goes here) -->
                    <div id="dark-media-container"></div>
                </div>
            </div>
        </div>

        <!-- Drag Handle -->
        <div id="slider-wrapper">
            <div class="slider-line">
                <div class="slider-button">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <div class="w-1"></div>
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 1. 국가별 상세 데이터 (텍스트 및 미디어 통합 관리) ---
        // mediaType을 'image' 또는 'video'로 설정하면, JS가 알아서 적절한 태그를 생성합니다.
        const countryData = {
            uk: { 
                name: '영국', flag: 'https://flagcdn.com/w1280/gb.png',
                light: {
                    title: '영국 제국의 산업 혁명과 번영',
                    description: '노예 무역과 플랜테이션 농업으로 막대한 자본을 축적한 영국은 산업혁명의 든든한 기틀을 마련했습니다. 리버풀, 브리스톨 등의 항구 도시는 금융과 상업의 중심으로 크게 번성했습니다.',
                    mediaType: 'image',
                    mediaSrc: './images/uk-light.jpg' // 예: 산업혁명 공장 그림 또는 리버풀 항구
                },
                dark: {
                    title: '역사상 가장 큰 규모의 인간 사냥',
                    description: '18세기 대서양 노예 무역을 주도한 영국은 수백만 명의 아프리카인들을 노예선 선창에 짐짝처럼 구겨 넣어 아메리카로 강제 이주 시켰습니다.',
                    mediaType: 'video',
                    mediaSrc: './images/uk-dark.mp4' // 예: 노예선 내부를 묘사한 참혹한 애니메이션/영상
                }
            },
            fr: { 
                name: '프랑스', flag: 'https://flagcdn.com/w1280/fr.png',
                light: {
                    title: '화려한 부르주아 문화의 토대',
                    description: '프랑스의 낭트와 보르도 항구는 설탕과 커피 등 식민지 수확물을 통해 엄청난 부를 거머쥐었습니다. 이 막대한 부는 프랑스의 사치스러운 예술과 건축, 부르주아 사회의 밑거름이 되었습니다.',
                    mediaType: 'image',
                    mediaSrc: './images/france-light.jpg' 
                },
                dark: {
                    title: '생도맹그(아이티)의 참극',
                    description: '프랑스의 가장 부유한 식민지였던 생도맹그에서는 극도로 가혹한 노동이 강요되었습니다. 가혹한 매질과 열악한 환경으로 수많은 노예들이 수년 내에 목숨을 잃었습니다.',
                    mediaType: 'image', // 프랑스는 암(暗)도 이미지로 테스트
                    mediaSrc: './images/france-dark.jpg'
                }
            },
            nl: { 
                name: '네덜란드', flag: 'https://flagcdn.com/w1280/nl.png',
                light: {
                    title: '황금시대의 상업 제국',
                    description: '네덜란드 서인도 회사(WIC)를 앞세운 국제 무역은 네덜란드 공화국에 17세기 전례 없는 경제적 황금기를 가져다주었습니다.',
                    mediaType: 'image',
                    mediaSrc: './images/nl-light.png'
                },
                dark: {
                    title: '가혹한 중간 기착지, 엘미나성',
                    description: '아프리카 해안의 요새들(특히 엘미나 성)에서 아프리카인들은 인간의 취급을 받지 못한 채 배에 실리기 전까지 끔찍한 환경에 갇혀 있었습니다.',
                    mediaType: 'video',
                    mediaSrc: './images/nl-dark.mp4'
                }
            },
            pt: { 
                name: '포르투갈', flag: 'https://flagcdn.com/w1280/pt.png',
                light: {
                    title: '최초의 글로벌 무역망 구축',
                    description: '가장 먼저 해상 제국을 건설한 포르투갈은 식민지 브라질을 통해 유럽 전역에 귀중품과 자원을 공급하며 초창기 엄청난 부를 획득했습니다.',
                    mediaType: 'video',
                    mediaSrc: './images/siu.mp4'
                },
                dark: {
                    title: '가장 길고 거대한 착취의 역사',
                    description: '포르투갈은 노예 무역에 참여한 모든 유럽 국가 중 가장 많은 수(약 500만 명 이상)의 아프리카인들을 브라질 등지로 강제 이주시킨 국가입니다.',
                    mediaType: 'image',
                    mediaSrc: './images/pt-dark.jpg'
                }
            },
            es: { 
                name: '스페인', flag: 'https://flagcdn.com/w1280/es.png',
                light: {
                    title: '신대륙의 막대한 부와 은(Silver)',
                    description: '스페인 제국은 아프리카 노예 노동력을 바탕으로 신대륙의 광산과 대농장을 운영하며 유럽 경제를 뒤흔들 막대한 금과 은을 유럽으로 가져왔습니다.',
                    mediaType: 'image',
                    mediaSrc: './images/es-light.jpg'
                },
                dark: {
                    title: '아시엔토(Asiento)와 끔찍한 광산 노동',
                    description: '독점 노예 공급권인 아시엔토를 통해 수많은 노예가 수입되었으며, 원주민과 흑인 노예들은 광산의 치명적인 환경 속에서 소모품처럼 쓰이다 죽어갔습니다.',
                    mediaType: 'video',
                    mediaSrc: './images/es-dark.mp4'
                }
            }
        };

        // --- 2. DOM Elements & State ---
        const container = document.getElementById('flags-container');
        const sliderWrapper = document.getElementById('slider-wrapper');
        const panelLight = document.getElementById('panel-light');
        const flagOverlay = document.getElementById('flag-overlay');
        const flagTint = document.getElementById('flag-tint');
        const contentLight = document.getElementById('content-light');
        const contentDark = document.getElementById('content-dark');
        
        let isDragging = false;
        let windowWidth = window.innerWidth;

        // --- 3. UI Initialization ---
        function initApp() {
            Object.keys(countryData).forEach(key => {
                const country = countryData[key];
                const card = document.createElement('div');
                card.className = 'flag-card rounded-xl overflow-hidden flex flex-col items-center pb-5';
                card.onclick = () => openDetail(key); // 키값을 전달
                
                card.innerHTML = `
                    <div class="w-full h-32 md:h-40 bg-slate-900 flex items-center justify-center overflow-hidden mb-4 border-b border-white/10">
                        <img src="${country.flag}" alt="${country.name} 국기" class="w-full h-full object-cover">
                    </div>
                    <h3 class="text-xl font-bold text-white tracking-widest">${country.name}</h3>
                `;
                container.appendChild(card);
            });
        }

        // --- 4. 미디어 HTML 생성 헬퍼 함수 ---
        // 이미지인지 영상인지 판별하여 적절한 태그를 반환합니다.
        function generateMediaHTML(type, src) {
            if (!src) return ''; // 파일 경로가 없으면 빈 문자열
            
            if (type === 'video') {
                return `<video class="media-element" src="${src}" autoplay loop muted playsinline></video>`;
            } else {
                return `<img class="media-element" src="${src}" alt="역사적 자료 이미지">`;
            }
        }

        // --- STREAMING_CHUNK:Event Handling and Layout Updates... ---
        function openDetail(countryKey) {
            const data = countryData[countryKey];

            // 1. 배경 국기 설정
            flagOverlay.style.backgroundImage = `url('${data.flag}')`;
            
            // 2. 텍스트 설정
            document.getElementById('light-title').innerText = data.light.title;
            document.getElementById('light-desc').innerText = data.light.description;
            
            document.getElementById('dark-title').innerText = data.dark.title;
            document.getElementById('dark-desc').innerText = data.dark.description;

            // 3. 미디어(이미지/영상) 동적 삽입
            document.getElementById('light-media-container').innerHTML = generateMediaHTML(data.light.mediaType, data.light.mediaSrc);
            document.getElementById('dark-media-container').innerHTML = generateMediaHTML(data.dark.mediaType, data.dark.mediaSrc);

            // 4. 슬라이더 중앙으로 초기화
            updateSlider(window.innerWidth / 2, window.innerWidth);

            // 5. 화면 전환
            document.getElementById('home-screen').classList.remove('active');
            document.getElementById('detail-screen').classList.add('active');
        }

        function goBack() {
            document.getElementById('detail-screen').classList.remove('active');
            document.getElementById('home-screen').classList.add('active');
            
            // 영상이 뒤에서 재생되는 것을 막기 위해 미디어 컨테이너 비우기
            setTimeout(() => {
                document.getElementById('light-media-container').innerHTML = '';
                document.getElementById('dark-media-container').innerHTML = '';
            }, 800);
        }

        // --- 5. 슬라이더 및 시각 효과 로직 ---
        function updateSlider(clientX, currentWindowWidth) {
            let x = Math.max(0, Math.min(clientX, currentWindowWidth));
            let percentage = (x / currentWindowWidth) * 100;

            // 슬라이더 이동
            sliderWrapper.style.left = `${percentage}%`;

            // 분할 화면 (Clip)
            panelLight.style.clipPath = `inset(0 ${100 - percentage}% 0 0)`;

            let diff = Math.abs(percentage - 50);

            // 국기 투명도 (중앙에서 멀어지면 서서히 사라짐)
            let flagOpacity = 1 - (diff / 25);
            flagOverlay.style.opacity = Math.max(0, flagOpacity);

            // 빛과 어둠 연출 및 콘텐츠 표시
            if (percentage < 50) {
                // 왼쪽으로 드래그 (암 - Dark)
                flagTint.style.mixBlendMode = 'multiply';
                flagTint.style.backgroundColor = 'rgba(153, 0, 0, 1)'; // 핏빛 붉은색
                flagTint.style.opacity = Math.min(1, diff / 25); 

                if (percentage < 45) {
                    let darkOp = (45 - percentage) / 20; 
                    contentDark.style.opacity = Math.min(1, darkOp);
                } else {
                    contentDark.style.opacity = 0;
                }
                contentLight.style.opacity = 0;

            } else if (percentage > 50) {
                // 오른쪽으로 드래그 (명 - Light)
                flagTint.style.mixBlendMode = 'overlay'; 
                flagTint.style.backgroundColor = 'rgba(255, 215, 0, 1)'; // 눈부신 금빛
                flagTint.style.opacity = Math.min(1, diff / 25);

                if (percentage > 55) {
                    let lightOp = (percentage - 55) / 20; 
                    contentLight.style.opacity = Math.min(1, lightOp);
                } else {
                    contentLight.style.opacity = 0;
                }
                contentDark.style.opacity = 0;
                
            } else {
                flagTint.style.opacity = 0;
                contentLight.style.opacity = 0;
                contentDark.style.opacity = 0;
            }
        }

        // Pointer Events (모바일 및 데스크탑 완벽 지원)
        sliderWrapper.addEventListener('pointerdown', (e) => {
            isDragging = true;
            windowWidth = window.innerWidth;
            sliderWrapper.setPointerCapture(e.pointerId); 
        });

        sliderWrapper.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); 
            updateSlider(e.clientX, windowWidth);
        });

        sliderWrapper.addEventListener('pointerup', (e) => {
            isDragging = false;
            sliderWrapper.releasePointerCapture(e.pointerId);
        });
        
        sliderWrapper.addEventListener('pointercancel', (e) => {
            isDragging = false;
        });

        window.addEventListener('resize', () => {
            windowWidth = window.innerWidth;
            if (document.getElementById('detail-screen').classList.contains('active')) {
                updateSlider(windowWidth / 2, windowWidth);
            }
        });

        // 시작
        initApp();
    </script>
</body>
</html>
